spring:
  application:
    name: portfolio-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:portfolio}?sslmode=${DB_SSLMODE:disable}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:portfolio}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:portfolio}}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:c2VjcmV0LWRlLWRldmVsb3BlbWllbnRvLXBvcnRmb2xpby1kZW1vLTIwMjYtMDAxMjM0NTY3ODk}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:720}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin123}
  upload-dir: ${UPLOAD_DIR:./uploads}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
